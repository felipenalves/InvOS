name: "Fábrica de Carrosséis Instagram"
code: "instagram-carrossel"
description: >
  Pipeline de produção: tema ou notícia → pesquisa → ângulos → copy → visual →
  slides → revisão → publicação (ou handoff humano). Minimiza trabalho do dono:
  ele só aprova nos checkpoints.
icon: "📸"
version: "1.1.0-invos"
created: "2026-03-03"
adapted_for: "INVOS"
mode: "alta-performance"

# INVOS wiring (lê da raiz do projeto, não de company OpenSquad)
invos:
  marca: "marca/marca.md"
  empresa: "memoria/empresa.md"
  perfil: "memoria/perfil.md"
  conteudo_fila: "conteudo/_fila.md"
  runs: "conteudo/carrosseis/"
  composio: "integracoes/composio/README.md"
  social_skill: ".agents/skills/social-content/SKILL.md"

memory: "_memory/memories.md"

target_audience: "ICP em memoria/empresa.md + marca/marca.md (não hardcode)"
platform: "Instagram Feed"
format: "instagram-feed"
performance_mode: "alta-performance"

skills:
  - web_search
  - web_fetch
  - instagram-carrossel    # pacote único: SKILL + references/render|fetch|publish
  - bash

data:
  - pipeline/data/research-brief.md
  - pipeline/data/domain-framework.md
  - pipeline/data/quality-criteria.md
  - pipeline/data/output-examples.md
  - pipeline/data/anti-patterns.md
  - pipeline/data/tone-of-voice.md

agents:
  - id: researcher
    name: "Researcher"
    icon: "🔍"
    custom: agents/researcher.custom.md
  - id: copywriter
    name: "Copywriter"
    icon: "✍️"
    custom: agents/copywriter.custom.md
  - id: image-designer
    name: "Image Designer"
    icon: "🎨"
    custom: agents/image-designer.custom.md
  - id: reviewer
    name: "Reviewer"
    icon: "✅"
    custom: agents/reviewer.custom.md
  - id: publisher
    name: "Publisher"
    icon: "📤"
    custom: agents/publisher.custom.md

pipeline:
  entry: pipeline/pipeline.yaml

# Artefatos da run: pasta do squad + cópia em conteudo/carrosseis/YYYY-MM-DD-slug/
output_dir: output/
